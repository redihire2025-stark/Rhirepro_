[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Route /admin/companies API calls directly to Netlify serverless function
[[redirects]]
  from = "/admin/companies/*"
  to = "/.netlify/functions/admin-companies"
  status = 200

[[redirects]]
  from = "/admin/companies"
  to = "/.netlify/functions/admin-companies"
  status = 200

# Route /api/* calls directly to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — all routes served from index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

