[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Payment endpoints are nested, so the /api/* splat below would resolve them to
# /.netlify/functions/payments/create-order — a path that does not exist. The
# functions declare these paths themselves via `config.path`, but map them
# explicitly here too so routing does not depend on which mechanism wins.
# Must precede the splat.
[[redirects]]
  from = "/api/payments/create-order"
  to = "/.netlify/functions/payments-create-order"
  status = 200

[[redirects]]
  from = "/api/payments/verify-payment"
  to = "/.netlify/functions/payments-verify-payment"
  status = 200

# Route /api/* calls directly to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Stale-bundle recovery. Netlify serves real files ahead of non-forced
# redirects, so an existing hashed asset is unaffected and this only fires for
# an /assets/ path that is gone — which means the caller is running an
# index.html cached from an older deploy. Without this the SPA rule below
# returned HTML for a .js request and the app silently failed to boot.
# Must precede the catch-all.
[[redirects]]
  from = "/assets/*"
  to = "/stale-bundle.js"
  status = 200

# SPA fallback — all routes served from index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ───────────────────────────────────────────────────────────────────
# index.html must never be served from cache. Vite stamps a content hash into
# every bundle name, so a stale index.html points at asset filenames that no
# longer exist on the current deploy — and because of the SPA rule above those
# requests fall through and return index.html itself, so the browser receives
# HTML where it expects JavaScript and the app never boots.
# Every route is served the same index.html by the SPA rule above, so the policy
# has to cover all paths — not just "/index.html". A request for
# /recruiter/dashboard/company-profile returns HTML, and naming only /index.html
# would leave those deep routes relying on Netlify's default behaviour.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Cache-Control alone governs the browser; Netlify's edge kept its own entry
    # and was observed holding this HTML with ttl=31535936 (365 days), so two
    # edge nodes served two different releases of the app and never revalidated.
    # Netlify-CDN-Cache-Control targets the edge specifically and takes
    # precedence there, forcing it to revalidate on every request.
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

# Declared after /* so it wins for asset paths. Hashed assets are immutable by
# construction: any content change produces a new filename, so these can be
# cached indefinitely and a new deploy is picked up via the fresh index.html
# rather than by expiry.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

