[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Route /api/* calls directly to Netlify serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — all routes served from index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ───────────────────────────────────────────────────────────────────
# index.html must never be served from cache. Vite stamps a content hash into
# every bundle name, so a stale index.html points at asset filenames that no
# longer exist on the current deploy — and because of the SPA rule above those
# requests fall through and return index.html itself, so the browser receives
# HTML where it expects JavaScript and the app never boots.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed assets are immutable by construction: any content change produces a new
# filename, so these can be cached indefinitely and a new deploy is picked up via
# the fresh index.html rather than by expiry.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

